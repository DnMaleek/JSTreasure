<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
        display: flex;
        height: 100vh;
        justify-content: center;
        align-items: center;
        background-color: rgb(239, 239, 239);
    }
    form {
        background: white;
        padding: 50px 50px;
        display: flex;
        flex-direction: column;
        align-items: center;
        border-radius: 8px;
        box-shadow: 4px 4px 20px rgb(224, 224, 224);
    }
    form h2 {
        margin-top: 0;
    }
    .image {
        height: 100px;
        width: 100px;
        border-radius: 50%;
        margin-bottom: 20px;
    }
    .inputs {
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
    }

    input {
        width: 100%;
        padding: 5px;
        border-radius: 8px;
        border: 1px solid rgb(173, 173, 173);
    }

    button {
        width: 50%;
        height: 30px;
        border: none;
        border-radius: 8px;
        background: rgb(23, 141, 181);
        color: white;
    }
    button:hover {
        background-color: rgb(65, 164, 197);
    }
</style>
<body>
    <form id="form">

        <div class="image">
            <img src="./logo.png" alt="image" height="100px" width="100px">
        </div>
        <h2>Welcome Back</h2>
        <div class="inputs">
            <input type="text" name="" id="email" placeholder="test@jstreasure.dn">
            <input type="password" name="" id="password" placeholder="password">
            <button type="submit">Login</button>
        </div>
    </form>

    <script>
document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    // LOGIN REQUEST
    const loginRes = await fetch("/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, password })
    });

    const data = await loginRes.json();

    if (!data.token) {
        alert("Login failed");
        return;
    }

    // SAVE TOKEN
    localStorage.setItem("token", data.token);

    if (loginRes.ok) {
        window.location.href = "/dashboard";
    }

});
</script>
</body>
</html>
